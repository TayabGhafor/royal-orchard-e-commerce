services:
  - type: web
    name: royalorchard-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # Render injects PORT automatically; no need to set it.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_HTTP_PAYLOADS
        value: "false"
      - key: LOG_USER_PAYLOADS
        value: "false"
      - key: LOG_MONGO_QUERIES
        value: "false"

